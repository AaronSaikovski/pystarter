name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Generate pyproject.toml
        run: |
          rm -f pyproject.toml
          uv init --name pystarter --no-readme --python 3.13
          cat pyproject_base.toml >> pyproject.toml
      - name: Install dependencies
        run: uv add -r requirements.txt
      - name: Run isort
        run: uv tool run isort --check .
      - name: Run ruff
        run: uv tool run ruff check .
      - name: Run mypy
        run: uv tool run mypy --check-untyped-defs --ignore-missing-imports .
      - name: Run pyrefly
        run: uvx pyrefly check --summarize-errors

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Generate pyproject.toml
        run: |
          rm -f pyproject.toml
          uv init --name pystarter --no-readme --python 3.13
          cat pyproject_base.toml >> pyproject.toml
      - name: Install dependencies
        run: uv add -r requirements.txt
      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Generate pyproject.toml
        run: |
          rm -f pyproject.toml
          uv init --name pystarter --no-readme --python 3.13
          cat pyproject_base.toml >> pyproject.toml
      - name: Build package
        run: uv build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
